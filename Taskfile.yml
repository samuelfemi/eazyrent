version: "3"

# Taskfile (go-task). Run `task <name>`. Install: go install github.com/go-task/task/v3/cmd/task@latest
# No Makefile in this repo by convention.

dotenv: [".env"]

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  tools:task:
    desc: Install the task runner itself
    cmds:
      - go install github.com/go-task/task/v3/cmd/task@latest

  run:
    desc: Run the API (needs DATABASE_URL)
    cmds:
      - go run ./cmd/api

  dev:
    desc: Migrate up then run the API
    cmds:
      - task: migrate
      - task: run

  migrate:
    desc: Apply pending SQL migrations (up)
    cmds:
      - go run ./cmd/migrate up

  migrate-down:
    desc: Roll back the latest migration
    cmds:
      - go run ./cmd/migrate down

  docs:
    desc: Regenerate the OpenAPI spec rendered by Scalar (needs swag CLI on PATH)
    cmds:
      - swag init -g cmd/api/main.go -o docs --parseInternal
      # swag also emits docs.go for its own UI runtime, which this repo no
      # longer uses (Scalar reads swagger.json) — drop the byproduct.
      - rm docs/docs.go

  test:
    desc: Run all tests (DB tests run when DATABASE_URL is set, else they skip)
    cmds:
      - go test ./...

  lint:
    desc: Run staticcheck (installs it on demand)
    cmds:
      - go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format code
    cmds:
      - gofmt -l -w .

  fmt-check:
    desc: Fail if any file is not gofmt-formatted
    cmds:
      - gofmt -l .

  check:
    desc: Format check + vet + lint + tests
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test
